---
controller_templates:
  - name: SATELLITE / RHEL - Publish Content View
    project: Automated Management
    playbook: satellite_publish.yml
    inventory: Workshop Inventory
    credentials:
      - Satellite Credential
    extra_vars:
      env: Dev
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Select Content View
          variable: content_view
          type: multiplechoice
          choices: "{{ hostvars['satellite.example.com']['satellite_content_views'] | selectattr('name', 'match', '^RHEL.*$') | map(attribute='name') | list + hostvars['ansible-1.example.com']['satellite_content_views'] | selectattr('name', 'match', '^RHEL.*$') | map(attribute='name') | list }}"
          required: true

  - name: CONTROLLER / Update inventories via dynamic sources
    project: Automated Management
    playbook: controller_inventory_source_update.yml
    inventory: Workshop Inventory
    credentials:
      - Controller Credential
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Select inventory to update
          variable: content_view
          type: multiplechoice
          choices: "{{ hostvars['satellite.example.com']['satellite_content_views'] | selectattr('name', 'defined') | map(attribute='name') | list + hostvars['ansible-1.example.com']['satellite_content_views'] | selectattr('name', 'match', '^RHEL.*$') | map(attribute='name') | list }}"
          required: true
        - question_name: Choose Environment
          type: multiplechoice
          variable: env
          choices:
            - Dev
            - QA
            - Prod
          required: true

  - name: LEAPP / 01 Analysis
    project: Automated Management
    playbook: leapp_analysis.yml
    inventory: EC2 Dynamic Inventory
    credentials:
      - Workshop Credential
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Select inventory group
          type: multiplechoice
          variable: dynamic_inventory_group
          choices: "{{ hostvars['satellite.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^RHEL.*$') | map(attribute='name') | list}}"
          required: true
    ask_limit_on_launch: true

  - name: OS / Upgrade
    project: Automated Management
    playbook: leapp_upgrade.yml
    inventory: EC2 Dynamic Inventory
    credentials:
      - Workshop Credential
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Select inventory group
          type: multiplechoice
          variable: dynamic_inventory_group
          choices: "{{ hostvars['satellite.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^RHEL.*$') | map(attribute='name') | list }}"
          required: true
    ask_limit_on_launch: true

  - name: OS / Patch OS to latest
    project: Automated Management
    playbook: server_patch.yml
    inventory: EC2 Dynamic Inventory
    use_fact_cache: true
    credentials:
      - Workshop Credential
    extra_vars:
      include_startup_delay: true
    ask_variables_on_launch: true
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Select inventory group
          type: multiplechoice
          variable: dynamic_inventory_group
          choices: "{{ hostvars['satellite.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^RHEL.*$') | map(attribute='name') +
                       hostvars['satellite.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^CentOS.*$') | map(attribute='name') +
                       hostvars['satellite.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^OL.*$') | map(attribute='name') +
                       hostvars['satellite.example.com']['all_lifecycle_environments'] | selectattr('name', 'match', 'all') | map(attribute='name') +
                       hostvars['ansible-1.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^RHEL.*$') | map(attribute='name') | list }}"
          required: true
        - question_name: Include kernel updates? (Kernel update will result in system reboot)
          type: multiplechoice
          variable: include_kernel_updates
          choices:
            - 'yes'
            - 'no'
          default: 'yes'
          required: false
        - question_name: Check for updates only? Do not patch at this time?
          type: multiplechoice
          variable: update_check_only
          choices:
            - 'yes'
            - 'no'
          default: 'no'
          required: false
    ask_limit_on_launch: true

  - name: SATELLITE / Query for content host configuration details
    project: Automated Management
    playbook: query_satellite_resource_info_hosts_display_content_details.yml
    inventory: EC2 Dynamic Inventory
    credentials:
      - Satellite Credential
      - Workshop Credential
    extra_vars:
      org_name: "{{ hostvars['satellite.example.com']['satellite_organization'] }}"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Select inventory group
          question_description: Use to limit job to selected inventory host group.
          type: multiplechoice
          default: ''
          variable: dynamic_inventory_group
          choices: "{{ hostvars['satellite.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^RHEL.*$') | map(attribute='name') +
                       hostvars['satellite.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^CentOS.*$') | map(attribute='name') +
                       hostvars['satellite.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^OL.*$') | map(attribute='name') +
                       hostvars['satellite.example.com']['all_lifecycle_environments'] | selectattr('name', 'match', 'all') | map(attribute='name') +
                       hostvars['ansible-1.example.com']['satellite_lifecycle_environments'] | selectattr('name', 'match', '^RHEL.*$') | map(attribute='name') | list }}"
          required: true
        - question_name: Enter list of specific content hosts to limit to delimited by commas
          question_description: Use to limit job to specified content hosts that are members of inventory host group, leave blank for no limit.
          type: text
          default: ''
          variable: inventory_host_limit
          required: false
    ask_limit_on_launch: false
...
